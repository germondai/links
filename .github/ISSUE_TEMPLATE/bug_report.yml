name: Bug Report
description: Report a bug in @germondai/links
labels: [bug]
body:
  - type: input
    id: title
    attributes:
      label: Summary
      description: A short description of the bug
    validations:
      required: true

  - type: input
    id: bun-version
    attributes:
      label: Bun version
      description: Run `bun --version`
      placeholder: "1.x.x"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What steps lead to the bug?
      placeholder: |
        1. Edit links.config.ts with ...
        2. Run `bun dev`
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happens? Include any error messages.
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Sanitized config snippet
      description: Paste the relevant parts of your links.config.ts (remove personal URLs/emails)
      render: typescript

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, logs, or anything else that might help
